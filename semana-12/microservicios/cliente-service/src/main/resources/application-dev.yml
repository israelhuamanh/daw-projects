server:
  port: 8081

spring:
  application:
    name: cliente-service
  datasource:
    url: jdbc:mysql://localhost:3306/bd_cliente_dev?createDatabaseIfNotExist=true&useSSL=false
    username: root
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

empresa:
  ambiente: desarrollo

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
