# ==========================================
# Configuración Principal - Laboratorio Semana 9
# Autenticación JWT y Spring Security
# ==========================================
spring.application.name=laboratorio-semana-9
server.port=8080

# Base de datos H2 en memoria compatible con MySQL (para ejecución inmediata sin dependencias)
spring.datasource.url=jdbc:h2:mem:security_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Configuración JWT (según guía del laboratorio)
jwt.secret=clave_super_segura_clave_super_segura_2026_tecsup
jwt.expiration=3600000

# JSON Formatting
spring.jackson.serialization.indent-output=true
