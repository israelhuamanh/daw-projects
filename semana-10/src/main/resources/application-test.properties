# ==========================================
# Perfil PRUEBAS (test) - TechSolutions SAC
# ==========================================
server.port=${SERVER_PORT:8081}

empresa.ambiente=PRUEBAS
empresa.perfil=test
empresa.basedatos=empleados_test

# Base de datos (MySQL con fallback H2 en memoria compatible)
spring.datasource.url=${DB_URL:jdbc:h2:mem:empleados_test;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
