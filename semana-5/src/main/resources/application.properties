# ==========================================
# Configuración Principal - Laboratorio Semana 5
# Validación y Manejo de Errores con Spring Boot
# ==========================================
spring.application.name=laboratorio-semana-5
server.port=8080

# Configuración H2 en memoria compatible con MySQL (para ejecución inmediata sin dependencias)
spring.datasource.url=jdbc:h2:mem:laboratorio_api;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Accesible en http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Formateo JSON de respuesta
spring.jackson.serialization.indent-output=true
