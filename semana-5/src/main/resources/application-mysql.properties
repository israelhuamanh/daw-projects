# ==========================================
# Configuración Perfil MySQL (Guía de Laboratorio Semana 5)
# Activar con: --spring.profiles.active=mysql
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/laboratorio_api?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
