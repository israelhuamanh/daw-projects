# ==========================================
# Perfil PRODUCCIÓN (prod) - TechSolutions SAC
# ==========================================
server.port=${SERVER_PORT:8083}

empresa.ambiente=PRODUCCION
empresa.perfil=prod
empresa.basedatos=empleados_prod

# Base de datos (MySQL con fallback H2 en memoria compatible)
spring.datasource.url=${DB_URL:jdbc:h2:mem:empleados_prod;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
# En producción se desactiva el logeo exhaustivo de SQL por rendimiento y seguridad
spring.jpa.show-sql=false
